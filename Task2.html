<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nav Bar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background:rgb(70, 30, 42);
            padding: 15px 20px;
            flex-wrap: wrap;
        }

        .brand {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 10px;
        }

        .nav-links a:hover {
            background: rgb(18, 107, 137);
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            nav {
                justify-content: center;
                text-align: center;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                margin-top: 10px;
            }

            .nav-links a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">LOGO</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>
</body>
</html>
