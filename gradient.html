<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box-1{
            width : 800px;
            height : 600px;
            background-image: radial-gradient(rgb(214, 78, 78),blue,orange,purple,pink);
        }
        .box-2{
            width : 800px;
            height : 600px;
            background-image : conic-gradient(rgb(117, 93, 186),yellow,red,rgb(7, 196, 229));
        }
        .box-3{
            width : 800px;
            height : 600px;
            background-image : linear-gradient(rgb(59, 35, 35),rgb(144, 35, 35),rgb(136, 55, 69),rgb(209, 56, 56));
        }
    </style>
</head>
<body>
    <h1>RADIAL GRADIENT</h1>
    <div class="box-1"></div>
    <br>
    <h1>CONIC GRADIENT</h1>
    <div class="box-2"></div>
    <br>
    <h1>LINEAR GRADIENT</h1>
    <div class="box-3"></div>
    

    
</body>
</html>
