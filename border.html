<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #1f2937, #111827);
            font-family: Arial, sans-serif;
        }

        .box {
            width: 420px;
            padding: 30px;
            border: 4px solid transparent;
            border-radius: 20px;
            background: linear-gradient(#111827, #111827) padding-box,
                        linear-gradient(135deg, #ff00cc, #3333ff, #00f5d4, #ffb703) border-box;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 15px;
            text-align: center;
            font-size: 58px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff00cc, #8a2be2, #00d2ff, #ffb703);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        p {
            margin: 0;
            text-align: center;
            color: #e5e7eb;
            font-size: 18px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>BOX</h1>
        <p>This content has a visible border around it.</p>
    </div>
</body>

</html>
