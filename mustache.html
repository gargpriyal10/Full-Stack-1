<!DOCTYPE html>
<html>

<head>
    <title>English Mustache</title>
    <style>
        body {
            background: #f5d0bc;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        /* Main moustache */
        .mustache {
            width: 240px;
            height: 70px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Left side */
        .left {
            width: 120px;
            height: 30px;

            background: black;

            border-radius: 100% 0 20% 100%;

            transform: rotate(-7deg);
        }

        /* Right side */
        .right {
            width: 120px;
            height: 30px;

            background: black;

            border-radius: 0 100% 100% 20%;

            transform: rotate(7deg);
        }
    </style>
</head>

<body>

    <div class="mustache">
        <div class="left"></div>
        <div class="right"></div>
    </div>

</body>

</html>
