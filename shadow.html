<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Effects</title>
    <style>
        

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f3f3f3, #dfe9f3);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(3, minmax(200px, 1fr));
            gap: 30px;
            align-items: center;
        }

        .demo-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .text-demo h2 {
            font-size: 2.3rem;
            margin: 0;
            color: #333;
            text-shadow: 3px 4px 6px rgba(0, 0, 0, 0.5);
        }

        .object-demo {
            position: relative;
            width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .object {
            width: 120px;
            height: 120px;
            border-radius: 30% 70% 65% 35% / 42% 38% 62% 58%;
            background: linear-gradient(135deg, #ff9a3d, #ff5f6d);
            filter: drop-shadow(8px 12px 10px rgba(0, 0, 0, 0.45));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .box-demo {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #66b6ff, #3b82f6);
            border-radius: 18px;
            color: white;
            font-weight: bold;
            box-shadow: 8px 12px 18px rgba(0, 0, 0, 0.35),
                        0 0 0 4px rgba(59, 130, 246, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h3 {
            margin: 0 0 20px 0;
            color: #444;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="demo-box text-demo">
            <h3>Text Shadow</h3>
            <h2>HELLO</h2>
        </div>

        <div class="demo-box object-demo-box">
            <h3>Object Shadow</h3>
            <div class="object-demo">
                <div class="object">OBJECT</div>
            </div>
        </div>

        <div class="demo-box box-demo-box">
            <h3>Box Shadow</h3>
            <div class="box-demo">BOX</div>
        </div>
    </div>
</body>
</html>
