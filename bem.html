<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            outline:1px solid black;
            width:200px;
            padding:3%;
            box-shadow:3px 3px 5px grey;
            margin:auto;
        }
        .card__img{
            width:100%;
            height:150px;
        }
        .card__text{
            font-family: Arial;
            font-weight:900;
            
        }
        .card__button__submit{
            background-color:rgb(16, 16, 15);
            color:white;
            box-shadow:3px 3px 5px grey;
            width:100px;
            height:40px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="card__img" src="https://picsum.photos/seed/picsum/536/354">
        <p class="card__text">Lorem Ipsum</p>
        <button class="card__button__submit">Submit</button>

    </div>
    
</body>
</html>
