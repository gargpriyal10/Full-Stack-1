<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Image Stacking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #111;
      font-family: Arial, sans-serif;
    }

    .card-container {
      width: 100%;
    }

    .card {
      position: sticky; 
      top: 0;           
      height: 100vh;    
      width: 100%;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      display: block;
    }

  
  </style>
</head>
<body>

  <div class="card-container">
    
    <div class="card">
      <img src="https://picsum.photos/id/1015/1600/900" alt="Landscape 1">
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1018/1600/900" alt="Landscape 2">
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1025/1600/900" alt="Landscape 3">
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1039/1600/900" alt="Landscape 4">
    </div>

  </div>

</body>
</html>
